spring:
  application:
    name: lunatierra-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lunatierra}
    username: ${DB_USERNAME:lunatierra}
    password: ${DB_PASSWORD:Dev230319}
    hikari:
      pool-name: LunatierraHikariPool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: classpath:data.sql

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.lunatierra.backend: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  file:
    name: C:/APP/Lunatierra/logs/lunaTierra.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

ai:
  ollama:
    enabled: ${AI_OLLAMA_ENABLED:true}
    base-url: ${AI_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${AI_OLLAMA_MODEL:mistral}
    timeout-ms: ${AI_OLLAMA_TIMEOUT_MS:80000}

weather:
  open-meteo:
    enabled: ${WEATHER_OPEN_METEO_ENABLED:true}
    base-url: ${WEATHER_OPEN_METEO_BASE_URL:https://api.open-meteo.com}
    timeout-ms: ${WEATHER_OPEN_METEO_TIMEOUT_MS:2500}

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:505942313293-lgjbdeis2nocnuafq7cadop00hlsr7vh.apps.googleusercontent.com}
  jwt:
    secret: ${JWT_SECRET:lunatierra-dev-secret-lunatierra-dev-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000}
